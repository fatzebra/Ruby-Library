version: 2
updates:
  - package-ecosystem: bundler
    directories:
      - /gemfiles/*
    schedule:
      interval: weekly
    groups:
      non-major-dependencies:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 28
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      non-major-dependencies:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 28
